[package]
name = "hogmap"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
description = "Core model and filters for a Windows disk-space treemap"
repository = "https://github.com/Yivas/hogmap"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:eframe"]

[dependencies]
eframe = { version = "=0.35.0", optional = true, default-features = false, features = ["glow", "default_fonts", "accesskit", "persistence"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Ioctl"] }

[[bin]]
name = "hogmap"
path = "src/main.rs"
required-features = ["desktop"]

[lints.rust]
# Only scan_win and volume allow unsafe for audited Win32 FFI; forbid cannot be relaxed per module.
unsafe_code = "deny"

[lints.clippy]
all = "warn"

# Keep development builds small enough for the per-session disk budget.
# Release builds are compiled separately, only to measure or package.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
