name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.94.1 fmt -- --check
      - name: Clippy
        run: cargo +1.94.1 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.94.1 test --locked
