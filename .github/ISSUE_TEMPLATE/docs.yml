name: Documentation correction
description: Report a wrong, unclear or broken part of the documentation.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: These documents are the project until a prototype exists, so a correction is a real contribution. Remove credentials, personal paths and disk or file inventories before posting. Use private security reporting for vulnerabilities.
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: The file and the sentence that is wrong, unclear or broken.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correction
      description: The wording you propose, or what the sentence should say instead.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, personal paths, disk or file inventories, and screenshots that show folder or file names.
          required: true
