version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible-cargo:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /wiki
    schedule:
      interval: weekly
    groups:
      compatible-docs:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible-actions:
        patterns: ['*']
        update-types: [minor, patch]
