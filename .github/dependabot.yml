version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible-cargo:
        patterns: ['*']
        update-types: [minor, patch]
  # The documentation toolchain is pinned to the VitePress build that already exists on the
  # maintainer's machine (no new installs), so npm updates are not proposed automatically.
  # Change it only with an explicit decision and a matching local toolchain.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible-actions:
        patterns: ['*']
        update-types: [minor, patch]
